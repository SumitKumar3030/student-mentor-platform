<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    
    <!-- Outer glow instead of dark shadow for dark mode tabs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C6FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Solid rounded background card for clean framing in browser tabs -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />

  <!-- Simplified Bold 'P' / Pulse Monogram optimized for tiny resolutions -->
  <g filter="url(#glow)">
    <path d="M144 384V128C144 105.909 161.909 88 184 88H304C374.692 88 432 145.308 432 216C432 286.692 374.692 344 304 344H144M144 240H320" fill="none" stroke="url(#faviconGrad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Accent Nodes -->
    <circle cx="304" cy="88" r="22" fill="#FF5722" />
    <circle cx="144" cy="384" r="22" fill="#00C6FF" />
  </g>
</svg>